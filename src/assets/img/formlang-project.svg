<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg1)"/>

  <!-- automaton graph: states + transitions -->
  <g fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9">
    <circle cx="80" cy="150" r="26"/>
    <circle cx="200" cy="80" r="26"/>
    <circle cx="200" cy="220" r="26"/>
    <circle cx="320" cy="150" r="30"/>
    <circle cx="320" cy="150" r="24"/>

    <path d="M106,150 L174,88" marker-end="url(#arrow)"/>
    <path d="M106,150 L174,212" marker-end="url(#arrow)"/>
    <path d="M224,80 L296,138" marker-end="url(#arrow)"/>
    <path d="M224,220 L296,162" marker-end="url(#arrow)"/>
    <path d="M60,132 C40,110 40,190 60,168" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fff"/>
    </marker>
  </defs>

  <g font-family="monospace" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">
    <text x="80" y="155">q0</text>
    <text x="200" y="85">q1</text>
    <text x="200" y="225">q2</text>
    <text x="320" y="155">qf</text>
  </g>

  <text x="200" y="270" font-family="Poppins, sans-serif" font-size="20" font-weight="600" fill="#fff" text-anchor="middle" opacity="0.95">formlang</text>
</svg>
